name: PII Scan

# Scans CSV, TXT, and other text files in the repo for PII.
# Fails the build if raw PII is found — use `piiwall tokenize` to sanitize first.

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  pii-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install piiwall
        run: pip install piiwall

      - name: Scan for PII (DPDP + PCI)
        run: |
          find . \
            -not -path './.git/*' \
            -not -path './venv/*' \
            -not -path './.venv/*' \
            -not -path './node_modules/*' \
            \( -name "*.csv" -o -name "*.txt" -o -name "*.json" -o -name "*.log" \) \
            -print0 \
          | xargs -0 -I{} piiwall scan {} -p dpdp -p pci || \
          (echo "::error::PII detected in one or more files. Run piiwall tokenize to sanitize." && exit 1)
