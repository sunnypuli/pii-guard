- id: piiwall-scan
  name: piiwall PII scan
  description: >
    Scan staged files for PII before committing.
    Fails if any PII is detected. Use piiwall tokenize to sanitize first.
  language: python
  entry: piiwall scan
  args: [--preset, dpdp]
  types: [text]
  pass_filenames: true
  stages: [pre-commit]
