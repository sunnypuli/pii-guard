[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "piiwall"
version = "0.1.0"
description = "Local PII firewall for AI CLI tools. Tokenize before it leaves your machine."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "pii-guard contributors"}
]
keywords = ["privacy", "pii", "ai", "claude", "codex", "dpdp", "gdpr", "hipaa", "tokenization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
rich = [
    "pypdf>=3.0",
    "python-docx>=1.0",
    "openpyxl>=3.1",
]
all = [
    "pypdf>=3.0",
    "python-docx>=1.0",
    "openpyxl>=3.1",
    "httpx>=0.25",
]

[project.urls]
Homepage = "https://github.com/sunnypuli/pii-guard"
Repository = "https://github.com/sunnypuli/pii-guard"
Issues = "https://github.com/sunnypuli/pii-guard/issues"

[project.scripts]
pii-guard = "pii_guard.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["pii_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
